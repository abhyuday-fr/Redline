name = "std::ranges"
header = "#include <ranges>"
summary = "composable, lazily evaluated views over sequences"
synopsis = """
namespace std::views { filter, transform, take, drop, reverse, ... }
"""
description = """
Ranges treat a whole sequence as one object, so algorithms no longer
need an iterator pair. Views are lightweight adaptors that do their work
lazily, and they chain with the pipe operator.

Nothing is computed until you iterate over the result.
"""
example = """
std::vector<int> v = {1, 2, 3, 4, 5, 6};

auto result = v
    | std::views::filter([](int x) { return x % 2 == 0; })
    | std::views::transform([](int x) { return x * x; });

for (int x : result) std::cout << x << " ";   // 4 16 36
"""
notes = """
Views do not own their elements, so the underlying container must outlive
them. C++20 ships a limited set of adaptors; zip, enumerate and others
arrived in C++23.
"""
see_also = ["concepts", "std::span"]
